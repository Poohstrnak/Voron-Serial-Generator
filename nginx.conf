# Requests reach nginx through Fly's proxy (a 172.16.x.x address), so log the visitor's address
# instead: Cloudflare's CF-Connecting-IP when the request came through Cloudflare, else Fly's
# Fly-Client-IP (e.g. visits to the .fly.dev address). These headers can be faked by a client that
# skips Cloudflare, which is fine for logs but means they shouldn't be used for access control.
map $http_fly_client_ip $fly_or_remote {
    ""      $remote_addr;
    default $http_fly_client_ip;
}
map $http_cf_connecting_ip $visitor_ip {
    ""      $fly_or_remote;
    default $http_cf_connecting_ip;
}
log_format visitor '$visitor_ip - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 8080;
    access_log /var/log/nginx/access.log visitor;
    root /usr/share/nginx/html;

    types {
        model/stl stl;
        font/ttf  ttf;
    }
    include /etc/nginx/mime.types;

    gzip on;
    gzip_types application/javascript model/stl font/ttf;

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
